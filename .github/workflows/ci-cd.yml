name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_NAME: todo
      ADMIN_DB_USER: todo
      ADMIN_DB_PASSWORD: testpass
      APP_DB_USER: todo_app
      APP_DB_PASSWORD: testapppass123
      DB_USER: todo
      DB_PASSWORD: testpass

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          pip install -r requirements-dev.txt

      - name: Verify migration and least-privilege DB script
        run: |
          python app/migrate.py
          POSTGRES_USER="$ADMIN_DB_USER" POSTGRES_PASSWORD="$ADMIN_DB_PASSWORD" POSTGRES_DB="$DB_NAME" PGHOST="$DB_HOST" sh db/app-user.sh
          POSTGRES_USER="$ADMIN_DB_USER" POSTGRES_PASSWORD="$ADMIN_DB_PASSWORD" POSTGRES_DB="$DB_NAME" PGHOST="$DB_HOST" sh db/app-user.sh

      - name: Run tests
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t todo-app:${{ github.sha }} ./app

      - name: Validate Compose, Prometheus and Alertmanager configs
        run: |
          POSTGRES_USER=todo \
          POSTGRES_PASSWORD=dummy_admin_pass \
          POSTGRES_DB=todo \
          APP_DB_USER=todo_app \
          APP_DB_PASSWORD=dummy_app_pass \
          GRAFANA_ADMIN_PASSWORD=dummy_grafana_pass \
          GRAFANA_ROOT_URL=http://localhost/grafana/ \
          docker compose config --quiet

          docker run --rm \
            -v "$PWD/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.yml

          docker run --rm \
            -v "$PWD/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            --entrypoint /bin/amtool \
            prom/alertmanager:v0.28.1 \
            check-config /etc/alertmanager/alertmanager.yml

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 over SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -eu
          test -n "$SSH_KEY"
          test -n "$EC2_HOST"

          umask 077
          printf '%s\n' "$SSH_KEY" > key.pem
          trap 'rm -f key.pem' EXIT

          ssh -i key.pem \
            -o StrictHostKeyChecking=accept-new \
            ubuntu@"$EC2_HOST" \
            'set -e
             cd ~/devops-todo
             git pull --ff-only origin main
             bash scripts/deploy.sh'
